<!-- Bulk Actions Popup at Bottom Center -->
<div
  *ngIf="selectedCount > 0"
  (click)="$event.stopPropagation()"
  class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-white rounded-[2px] shadow-2xl border border-gray-300 px-6 py-4 flex items-center gap-4 z-50"
>
  <span class="font-medium text-gray-900">{{ selectedCount }} selected</span>

  <app-custom-button
    (action)="onDelete()"
    label="Delete"
    bgClass="bg-red-600"
    textColor="text-white"
    hoverClass="hover:bg-red-700"
    borderClass="border-none"
    height="h-9"
    padding="px-4"
  />
</div>
