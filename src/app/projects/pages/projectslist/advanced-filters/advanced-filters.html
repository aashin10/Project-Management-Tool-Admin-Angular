<!-- Advanced Filters Panel -->
<div
  *ngIf="showFilters"
  class="bg-white text-sm border border-gray-300 rounded-[2px] p-3 mb-4 mt-4"
>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-3">
    <!-- Status Filter -->
    <div>
      <label class="block font-semibold text-gray-900 mb-2">Status</label>
      <div class="space-y-1.5">
        <label
          *ngFor="let status of statusOptions"
          class="flex items-center gap-1 cursor-pointer hover:bg-gray-100 p-1 rounded transition-colors"
        >
          <input
            type="checkbox"
            [checked]="isStatusSelected(status.code)"
            (change)="toggleStatusFilter(status.code)"
            class="w-3 h-3 rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer"
          />
          <span class="text-xs text-gray-700">{{ status.code }}</span>
        </label>
      </div>
    </div>

    <!-- Delivery Unit Filter -->
    <div>
      <label class="block font-semibold text-gray-900 mb-2">Delivery Unit</label>
      <!-- Use a two-column grid for DU options and slightly smaller text -->
      <div class="grid grid-cols-2 gap-1">
        <label
          *ngFor="let deliveryUnit of deliveryUnitOptions"
          class="flex items-center gap-1 cursor-pointer hover:bg-gray-100 p-0.5 rounded transition-colors text-xs"
        >
          <input
            type="checkbox"
            [checked]="isDeliveryUnitSelected(deliveryUnit.code)"
            (change)="toggleDeliveryUnitFilter(deliveryUnit.code)"
            class="w-3 h-3 rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer"
          />
          <span class="text-xs text-gray-700">{{ deliveryUnit.code }}</span>
        </label>
      </div>
    </div>

    <!-- Project Manager Filter -->
    <div>
      <label class="block font-semibold text-gray-900 mb-2">Project Manager</label>

      <!-- Manager Search -->
      <div class="mb-2">
        <div class="flex items-center bg-gray-50 border border-gray-300 rounded px-2 py-1">
          <svg
            class="w-3 h-3 text-gray-400 mr-2"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
          <input
            type="text"
            [(ngModel)]="managerSearchQuery"
            placeholder="Search managers..."
            class="flex-1 text-xs outline-none bg-transparent text-gray-700"
          />
        </div>
      </div>

      <div class="space-y-1.5">
        <!-- Show Initial 3 Managers -->
        <label
          *ngFor="let manager of filteredManagers"
          class="flex items-center gap-1 cursor-pointer hover:bg-gray-100 p-1 rounded transition-colors"
        >
          <input
            type="checkbox"
            [checked]="isManagerSelected(manager.id)"
            (change)="toggleManagerFilter(manager.id)"
            class="w-3 h-3 rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer"
          />
          <span class="text-xs text-gray-700 truncate">{{ manager.name }}</span>
        </label>

        <!-- Show More Button - Only if more than 3 managers exist -->
        <button
          *ngIf="totalManagerCount > 3 && !showAllManagers"
          (click)="openManagerModal()"
          class="w-full text-left text-xs text-blue-600 hover:text-blue-700 font-medium p-1 cursor-pointer hover:bg-blue-50 rounded transition-colors"
        >
          + Show {{ totalManagerCount - 3 }} more
        </button>
      </div>
    </div>

    <!-- Manager Selection Modal -->
    <div
      *ngIf="showManagerModal"
      class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center"
      (click)="closeManagerModal()"
    >
      <div
        class="bg-white rounded-lg shadow-xl w-96 max-w-full mx-4"
        (click)="$event.stopPropagation()"
      >
        <!-- Modal Header -->
        <div class="px-4 py-3 border-b border-gray-200 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-900">Select Project Managers</h3>
          <button
            (click)="closeManagerModal()"
            class="text-gray-400 hover:text-gray-600 transition-colors"
            title="Close"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <!-- Modal Search -->
        <div class="px-4 py-3 border-b border-gray-100">
          <div class="flex items-center bg-gray-50 border border-gray-300 rounded px-2 py-2">
            <svg
              class="w-4 h-4 text-gray-400 mr-2 flex-shrink-0"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              />
            </svg>
            <input
              type="text"
              [(ngModel)]="modalSearchQuery"
              placeholder="Search managers..."
              class="flex-1 text-sm outline-none bg-transparent text-gray-700"
              (keyup)="updateModalManagersList()"
            />
          </div>
        </div>

        <!-- Modal Manager List - Scrollable -->
        <div class="max-h-64 overflow-y-auto">
          <label
            *ngFor="let manager of modalFilteredManagers"
            class="flex items-center gap-2 cursor-pointer hover:bg-gray-100 p-3 border-b border-gray-100 last:border-b-0 transition-colors"
          >
            <input
              type="checkbox"
              [checked]="isManagerSelected(manager.id)"
              (change)="toggleManagerFilter(manager.id)"
              class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer flex-shrink-0"
            />
            <span class="text-sm text-gray-700 break-words flex-1">{{ manager.name }}</span>
          </label>

          <!-- Empty State -->
          <div *ngIf="modalFilteredManagers.length === 0" class="px-4 py-8 text-center">
            <p class="text-sm text-gray-500">No managers found</p>
          </div>
        </div>

        <!-- Modal Footer -->
        <div class="px-4 py-3 border-t border-gray-200 flex items-center justify-end gap-2">
          <button
            (click)="closeManagerModal()"
            class="px-3 py-2 text-sm text-gray-700 bg-gray-100 hover:bg-gray-200 rounded transition-colors"
          >
            Done
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Selected Filters Display -->
  <div *ngIf="hasActiveFilters" class="mt-5 pt-5 border-t border-gray-200">
    <div class="flex items-center justify-between mb-3">
      <span class="text-sm font-semibold text-gray-900"
        >Active Filters ({{ getActiveFilterCount() }})</span
      >
      <button
        (click)="clearAllFilters()"
        class="text-sm text-blue-600 hover:text-blue-700 font-medium transition-colors cursor-pointer"
      >
        Clear All
      </button>
    </div>
    <div class="flex flex-wrap gap-2">
      <!-- Status filters -->
      <span
        *ngFor="let status of selectedStatusObjects"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-blue-50 text-blue-700 border border-blue-200 rounded-full text-sm font-medium"
      >
        <span>{{ status.code }}</span>
        <button
          (click)="removeStatusFilter(status.code)"
          class="hover:bg-blue-100 rounded-full p-0.5 transition-colors cursor-pointer"
          title="Remove {{ status.code }} filter"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </span>

      <!-- Delivery Unit filters -->
      <span
        *ngFor="let deliveryUnit of selectedDeliveryUnitObjects"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-purple-50 text-purple-700 border border-purple-200 rounded-full text-sm font-medium"
      >
        <span>{{ deliveryUnit.code }}</span>
        <button
          (click)="removeDeliveryUnitFilter(deliveryUnit.code)"
          class="hover:bg-purple-100 rounded-full p-0.5 transition-colors cursor-pointer"
          title="Remove {{ deliveryUnit.code }} filter"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </span>

      <!-- Manager filters -->
      <span
        *ngFor="let manager of selectedManagerObjects"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-green-50 text-green-700 border border-green-200 rounded-full text-sm font-medium"
      >
        <span>{{ manager.name }}</span>
        <button
          (click)="removeManagerFilter(manager.id)"
          class="hover:bg-green-100 rounded-full p-0.5 transition-colors cursor-pointer"
          title="Remove {{ manager.name }} filter"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </span>
    </div>
  </div>
</div>
