<!-- Main Container - Adapts to sidebar state -->
<div class="min-h-screen  transition-all duration-300">
  

  <!-- Back to Projects Button -->
  <div class="bg-white border-b border-gray-200 py-4">
    <button 
      (click)="goBackToProjects()"
      class="flex items-center gap-2 text-sm font-semibold text-gray-700 hover:text-gray-900 transition-colors cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" 
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"></path>
      </svg>
      Back to Projects
    </button>
  </div>


  <!-- Project Header Section - Fixed for all tabs -->
  <div class="bg-white mt-6 border border-gray-200">
    <div class="px-6 py-5">
      <div class="flex items-start justify-between">
        
        <!-- Left Section - Project Info -->
        <div class="flex items-start gap-4">
          <!-- Project Avatar -->
          <div 
            [style.background-color]="project.avatarColor"
            class="w-14 h-14 rounded-full flex items-center justify-center text-white font-semibold text-lg flex-shrink-0">
            {{ project.avatar }}
          </div>

          <!-- Project Details -->
          <div class="flex flex-col gap-2">
            <div class="flex items-baseline gap-2">
              <h1 class="text-xl font-bold text-gray-900">{{ project.name }}</h1>
              <span class="text-xs text-gray-500 font-medium">{{ project.code }}</span>
            </div>
            
            <div class="flex items-center">
              <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-700">
                {{ project.status }}
              </span>
            </div>
            
            <p class="text-sm text-gray-600">{{ project.description }}</p>
          </div>
        </div>

        
        <!-- Right Section - Action Buttons -->
        <div class="flex items-center gap-2">

          <app-custom-button
            [label]="'Edit Project'"
            [icon]="'/images/edit.svg'"
            [bgClass]="'bg-white'"
            [textColor]="'text-gray-700'"
            [borderClass]="'border border-gray-300'"
            [hoverClass]="'hover:bg-gray-50'"
            [extraClasses]="'transition-colors'"
            (action)="editProject()">
          </app-custom-button>

          <app-custom-button
            [label]="'Archive Project'"
            [icon]="'/images/archive.svg'"
            [bgClass]="'bg-white'"
            [textColor]="'text-gray-700'"
            [borderClass]="'border border-gray-300'"
            [hoverClass]="'hover:bg-gray-50'"
            [extraClasses]="'transition-colors'"
            (action)="archiveProject()">
          </app-custom-button>

          <app-custom-button
            [label]="'Delete Project'"
            [icon]="'/images/deletewhite.svg'"
            [bgClass]="'bg-red-600'"
            [textColor]="'text-white'"
            [borderClass]="''"
            [hoverClass]="'hover:bg-red-700'"
            [rounded]="'rounded'"
            [gap]="'gap-2'"
            [padding]="'px-3 py-1.5'"
            [fontSize]="'text-sm'"
            [fontWeight]="'font-medium'"
            [extraClasses]="'transition-colors items-center'"
            (action)="deleteProject()">
          </app-custom-button>

        </div>

      </div>
    </div>
  </div>

  <!-- Tab Navigation -->
  <div class="mt-1 bg-white border border-gray-200">
    <nav class="flex w-full">
      <button 
        (click)="selectTab('overview')"
        [class.bg-white]="activeTab === 'overview'"
        [class.text-blue-600]="activeTab === 'overview'"
        [class.border-b-2]="activeTab === 'overview'"
        [class.border-blue-600]="activeTab === 'overview'"
        [class.bg-gray-50]="activeTab !== 'overview'"
        [class.text-gray-600]="activeTab !== 'overview'"
        [class.border-b]="activeTab !== 'overview'"
        [class.border-gray-200]="activeTab !== 'overview'"
        class="flex-1 py-3 text-center text-sm font-medium hover:text-blue-600 hover:bg-gray-100 transition-all duration-200">
        Overview
      </button>
      
      <button 
        (click)="selectTab('team')"
        [class.bg-white]="activeTab === 'team'"
        [class.text-blue-600]="activeTab === 'team'"
        [class.border-b-2]="activeTab === 'team'"
        [class.border-blue-600]="activeTab === 'team'"
        [class.bg-gray-50]="activeTab !== 'team'"
        [class.text-gray-600]="activeTab !== 'team'"
        [class.border-b]="activeTab !== 'team'"
        [class.border-gray-200]="activeTab !== 'team'"
        class="flex-1 py-3 text-center text-sm font-medium hover:text-blue-600 hover:bg-gray-100 transition-all duration-200">
        Team & Roles
      </button>
    </nav>
  </div>

  <!-- Tab Content Area - Lazy Loaded Components -->
  <div class="mt-8">
    
    <!-- Overview Tab Content -->
    <div *ngIf="activeTab === 'overview'" class="animate-fadeIn">
      <app-overview  (viewAllClicked)="selectTab('team')"></app-overview>
    </div>

    <!-- Team & Roles Tab Content -->
    <div *ngIf="activeTab === 'team'" class="animate-fadeIn">
      <div class="bg-white">
        <app-teams-and-roles/>
      </div>
    </div>

  </div>
</div>
