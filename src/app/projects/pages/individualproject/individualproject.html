<!-- Main Container - Adapts to sidebar state -->
<div class="min-h-screen  transition-all duration-300">
  
  <!-- Back to Projects Button -->
  <div class="bg-white border-b border-gray-200 py-4">
    <button 
      (click)="goBackToProjects()"
      class="flex items-center gap-2 text-sm text-gray-600 hover:text-gray-900 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" 
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"></path>
      </svg>
      Back to Projects
    </button>
  </div>

  <!-- Project Header Section - Fixed for all tabs -->
  <div class="bg-white border-b border-gray-200 mt-6 rounded-lg shadow-sm">
    <div class="px-8 py-6">
      <div class="flex items-start justify-between">
        
        <!-- Left Section - Project Info -->
        <div class="flex items-start gap-6">
          <!-- Project Avatar -->
          <div 
            [style.background-color]="project.avatarColor"
            class="w-16 h-16 rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-md flex-shrink-0">
            {{ project.avatar }}
          </div>

          <!-- Project Details -->
          <div class="flex flex-col gap-2">
            <div class="flex items-center gap-3">
              <h1 class="text-2xl font-bold text-gray-900">{{ project.name }}</h1>
              <span class="text-sm text-gray-500 font-medium">{{ project.code }}</span>
            </div>
            
            <div class="flex items-center gap-2">
              <span class="inline-flex items-center px-3 py-1 rounded text-xs font-medium bg-green-100 text-green-800">
                {{ project.status }}
              </span>
            </div>
            
            <p class="text-sm text-gray-600 mt-1">{{ project.description }}</p>
          </div>
        </div>

        <!-- Right Section - Action Buttons -->
        <div class="flex items-center gap-3">
          <button 
            (click)="editProject()"
            class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded hover:bg-gray-50 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" 
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path>
              <path d="m15 5 4 4"></path>
            </svg>
            Edit Project
          </button>
          
          <button 
            (click)="archiveProject()"
            class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded hover:bg-gray-50 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" 
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="5" x="2" y="3" rx="1"></rect>
              <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"></path>
              <path d="M10 12h4"></path>
            </svg>
            Archive Project
          </button>
          
          <button 
            (click)="deleteProject()"
            class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-red-600 rounded hover:bg-red-700 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" 
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"></path>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
            </svg>
            Delete Project
          </button>
        </div>
      </div>
    </div>

    <!-- Tab Navigation -->
    <div class="border-t border-gray-200">
      <nav class="flex -mb-px">
        <button 
          (click)="selectTab('overview')"
          [class.border-blue-600]="activeTab === 'overview'"
          [class.text-blue-600]="activeTab === 'overview'"
          [class.border-transparent]="activeTab !== 'overview'"
          [class.text-gray-600]="activeTab !== 'overview'"
          class="px-6 py-4 text-sm font-medium border-b-2 hover:text-blue-600 hover:border-blue-400 transition-colors">
          Overview
        </button>
        
        <button 
          (click)="selectTab('team')"
          [class.border-blue-600]="activeTab === 'team'"
          [class.text-blue-600]="activeTab === 'team'"
          [class.border-transparent]="activeTab !== 'team'"
          [class.text-gray-600]="activeTab !== 'team'"
          class="px-6 py-4 text-sm font-medium border-b-2 hover:text-blue-600 hover:border-blue-400 transition-colors">
          Team & Roles
        </button>
      </nav>
    </div>
  </div>

  <!-- Tab Content Area - Lazy Loaded Components -->
  <div class="">
    
    <!-- Overview Tab Content -->
    <div *ngIf="activeTab === 'overview'" class="animate-fadeIn">
      <app-overview></app-overview>
    </div>


    <!-- Team & Roles Tab Content -->
    <div *ngIf="activeTab === 'team'" class="animate-fadeIn">
      <div class="bg-white">
        <app-teams-and-roles/>
      </div>
    </div>

  </div>
</div>
