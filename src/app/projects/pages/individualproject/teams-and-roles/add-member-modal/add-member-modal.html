<div class="fixed inset-0 bg-gray-200/20 backdrop-blur-[1px] flex items-center justify-center z-50">
  <div class="bg-white w-full max-w-md rounded-lg shadow-lg p-6 relative">

    <h2 class="text-lg font-semibold text-gray-900 mb-4">Add New Team Member</h2>

    <!-- Search Field -->
    <div class="mb-3">
      <input
        type="text"
        [(ngModel)]="searchQuery"
        placeholder="Search employees by name or email..."
        class="w-full border border-gray-300 rounded px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <!-- Employee List -->
    <ul *ngIf="searchQuery && filteredEmployees.length > 0" class="max-h-40 overflow-y-auto border rounded mb-3">
      <li
        *ngFor="let emp of filteredEmployees"
        (click)="selectEmployee(emp)"
        class="px-3 py-2 text-sm cursor-pointer hover:bg-blue-50"
        [class.bg-blue-100]="selectedEmployee?.id === emp.id"
      >
        <div class="font-medium text-gray-800">{{ emp.name }}</div>
        <div class="text-xs text-gray-500">{{ emp.email }}</div>
      </li>
    </ul>

    <!-- Selected Employee -->
    <div *ngIf="selectedEmployee" class="mb-3 p-3 border rounded bg-gray-50">
      <p class="text-sm font-medium text-gray-800">{{ selectedEmployee.name }}</p>
      <p class="text-xs text-gray-500">{{ selectedEmployee.department }} | {{ selectedEmployee.email }}</p>
    </div>

    <!-- Role Selection -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Assign Role</label>
      <select
        [(ngModel)]="selectedRole"
        class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500"
      >
        <option value="">Select Role</option>
        <option *ngFor="let role of roleOptions" [value]="role">{{ role }}</option>
      </select>
    </div>

    <!-- Buttons -->
    <div class="flex justify-end gap-3">
      <app-custom-button
        label="Cancel"
        [bgClass]="'bg-white'"
        [borderClass]="'border border-gray-300'"
        [textColor]="'text-gray-700'"
        [hoverClass]="'hover:bg-gray-50'"
        (action)="closeModal()"
      ></app-custom-button>

      <app-custom-button
        label="Add Member"
        [bgClass]="'bg-blue-600'"
        [hoverClass]="'hover:bg-blue-700'"
        [textColor]="'text-white'"
        (action)="addMember()"
      ></app-custom-button>
    </div>

  </div>
</div>
