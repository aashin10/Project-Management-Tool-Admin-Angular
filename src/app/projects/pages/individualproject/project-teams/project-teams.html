<div class="bg-white rounded-lg shadow-sm border border-gray-200">
  <!-- Header -->
  <div class="px-6 py-5 border-b border-gray-100">
    <div class="flex items-start justify-between">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <h2 class="text-lg font-semibold text-gray-900">Team Members</h2>
        </div>
        <p class="text-sm text-gray-500">View all team members by team</p>
      </div>

      <div class="flex items-center gap-4">
        <!-- Team Dropdown -->
        <div class="relative">
          <button 
            (click)="toggleDropdown()"
            class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-sm text-sm text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <span>{{ selectedTeamName }}</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              [class.rotate-180]="showDropdown" class="transition-transform">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <!-- Dropdown Menu -->
          <div *ngIf="showDropdown" 
            class="absolute right-0 mt-2 w-56 bg-white border border-gray-200 rounded-lg shadow-lg z-10">
            <div class="py-1">
              <button
                *ngFor="let team of teams"
                (click)="selectTeam(team.id)"
                [class.bg-blue-50]="team.id === selectedTeam"
                [class.text-blue-600]="team.id === selectedTeam"
                class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 focus:outline-none">
                {{ team.name }}
              </button>
            </div>
          </div>
        </div>

        <!-- Member Count Badge -->
        <div class="text-sm font-medium text-gray-900">
          {{ membersCount }} Members
        </div>
      </div>
    </div>
  </div>

  <!-- Members Grid -->
  <div class="p-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div *ngFor="let member of filteredMembers" 
        class="bg-white border border-gray-200 rounded-lg p-4 hover:shadow-md transition-shadow">
        
        <!-- Member Name -->
        <div class="mb-3">
          <h3 class="text-base font-semibold text-gray-900">{{ member.name }}</h3>
        </div>

        <!-- Member Details - 2 columns -->
        <div class="grid grid-cols-2 gap-3">
          <!-- Left Column -->
          <div class="space-y-2">
            <!-- Role -->
            <div>
              <p class="text-xs text-gray-500 mb-1">Role</p>
              <span
                [ngClass]="{
                  'bg-purple-50 text-purple-700 border-purple-200': member.role.includes('Lead'),
                  'bg-blue-50 text-blue-700 border-blue-200': member.role.includes('Developer'),
                  'bg-pink-50 text-pink-700 border-pink-200': member.role.includes('UX'),
                  'bg-orange-50 text-orange-700 border-orange-200': member.role === 'UI Designer',
                  'bg-green-50 text-green-700 border-green-200': member.role.includes('DevOps'),
                  'bg-amber-50 text-amber-700 border-amber-200': member.role.includes('QA'),
                  'bg-gray-50 text-gray-700 border-gray-200': member.role === 'Client'
                }"
                class="inline-flex items-center px-2 py-1 rounded text-xs font-medium border">
                {{ member.role }}
              </span>
            </div>

            <!-- Team -->
            <div>
              <p class="text-xs text-gray-500 mb-1">Team</p>
              <p class="text-sm text-gray-900">{{ getTeamName(member.team) }}</p>
            </div>
          </div>

          <!-- Right Column -->
          <div class="space-y-2">
            <!-- Email -->
            <div>
              <p class="text-xs text-gray-500 mb-1">Email</p>
              <p class="text-sm text-gray-900 truncate" [title]="member.email">{{ member.email }}</p>
            </div>

            <!-- ID -->
            <div>
              <p class="text-xs text-gray-500 mb-1">Member ID</p>
              <p class="text-sm text-gray-900">{{ member.id }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="filteredMembers.length === 0" class="text-center py-8">
      <p class="text-gray-500 text-sm">No team members found for this team.</p>
    </div>
  </div>
</div>
