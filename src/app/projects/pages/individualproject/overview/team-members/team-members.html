<div class="h-full">
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" 
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" 
        class="text-gray-700">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      <h2 class="text-lg font-semibold text-gray-900">Team Members</h2>
    </div>
    
      <ng-container *ngIf="showViewAll">
        <span class="text-sm font-semibold text-blue-600 cursor-pointer hover:text-blue-700 transition-colors"
              (click)="onViewAll()">
          View All →
        </span>
      </ng-container>
  </div>

  <div class="space-y-4">
    @for (member of teamMembers; track member.name) {
      <div class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-50 transition-colors">
        <div class="w-10 h-10 rounded-full flex items-center justify-center font-semibold"
             [class]="getColorClasses(member.color)">
          {{ member.initials }}
        </div>
        <div class="flex-1">
          <p class="text-sm font-medium text-gray-900">{{ member.name }}</p>
          <p class="text-xs text-gray-500">{{ member.role }}</p>
        </div>
      </div>
    }
  </div>
</div>
