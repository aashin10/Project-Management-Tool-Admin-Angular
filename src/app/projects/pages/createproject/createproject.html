

<div class="create-project-container w-full ">
  <div *ngIf="showSuccess" class="fixed top-0 left-0 w-full z-50 flex justify-center mt-4">
    <div style="background:rgba(34,197,94,0.15); color:#166534;" class="flex items-center gap-3 px-6 py-3 rounded font-semibold text-base shadow border border-green-200 animate-fade-in">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="10" fill="#22c55e" opacity="0.2"/><path stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4"/></svg>
      <div>
        <span class="font-semibold">Project created successfully</span>
        <br>
        <!-- <span class="font-normal">Proceed with cloning issues into <span class="inline-flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="#166534"><rect x="4" y="4" width="16" height="16" rx="3" fill="#e0fbe6" stroke="#22c55e" stroke-width="2"/><text x="12" y="16" text-anchor="middle" font-size="10" fill="#166534">T</text></svg><span class="underline font-semibold">TRYITFREE</span></span></span> -->
      </div>
    </div>
  </div>
  <div class="header-content mb-4">
    <app-sectiontitle title="Create New Project" description="Set up your project with team members and define objectives"></app-sectiontitle>
  </div>

  <div class="content-wrapper grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Left Section - Form -->
    <div class="form-section w-full">
      <app-basic-information
        [(projectName)]="projectName"
        [(projectKey)]="projectKey"
        [(description)]="description"
        [(organisationName)]="organisationName"
        [(pocEmail)]="pocEmail"
        [(phoneNumber)]="phoneNumber"
        [(status)]="status"
        (projectNameChange)="onProjectNameChange($event)"
        (projectKeyChange)="onProjectKeyChange($event)"
        (descriptionChange)="onDescriptionChange($event)"
        (organisationNameChange)="onOrganisationNameChange($event)"
        (pocEmailChange)="onPocEmailChange($event)"
        (phoneNumberChange)="onPhoneNumberChange($event)"
        (statusChange)="onStatusChange($event)"
      ></app-basic-information>

      <app-team-organization
        [(manager)]="manager"
        [(deliveryUnit)]="deliveryUnit"
        (managerChange)="onManagerChange($event)"
        (deliveryUnitChange)="onDeliveryUnitChange($event)"
      ></app-team-organization>

      <app-additionalinfo (addedFieldsChange)="additionalFields = $event"></app-additionalinfo>
    </div>

    <!-- Right Section - Project Preview Component -->
    <div class="w-full">
      <app-project-preview
        [projectName]="projectName"
        [projectKey]="projectKey"
        [organisationName]="organisationName"
        [pocEmail]="pocEmail"
        [phoneNumber]="phoneNumber"
        [manager]="manager"
        [deliveryUnit]="deliveryUnit"
        [template]="selectedTemplate"
        (createProject)="onCreateProject()"
        (cancel)="onCancel()"
      ></app-project-preview>
    </div>
  </div>
</div>
