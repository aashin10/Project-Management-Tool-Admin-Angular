<div class="create-project-container">
  <!-- <div class="header"> -->
  <!-- <div class="back-link flex items-center gap-2 text-gray-500 text-sm cursor-pointer transition-colors duration-200 hover:text-gray-700 mb-4">
      <i class="back-icon">←</i>
      <span>Back to Projects</span>
    </div> -->
    <div class="header-content">
      <app-sectiontitle title="Create New Project" description="Set up your project with team members and define objectives"></app-sectiontitle>
    <!-- </div> -->
  </div>

  <div class="content-wrapper">
    <!-- Left Section - Form -->
    <div class="form-section">
      <!-- Basic Information Component -->
      <app-basic-information
        [(projectName)]="projectName"
        [(projectKey)]="projectKey"
        [(description)]="description"
        [(organisationName)]="organisationName"
        [(pocEmail)]="pocEmail"
        [(phoneNumber)]="phoneNumber"
        (projectNameChange)="onProjectNameChange($event)"
        (projectKeyChange)="onProjectKeyChange($event)"
        (descriptionChange)="onDescriptionChange($event)"
        (organisationNameChange)="onOrganisationNameChange($event)"
        (pocEmailChange)="onPocEmailChange($event)"
        (phoneNumberChange)="onPhoneNumberChange($event)"
        
      ></app-basic-information>

      <!-- Team & Organization Component -->
      <app-team-organization
        [(manager)]="manager"
        [(deliveryUnit)]="deliveryUnit"
        (managerChange)="onManagerChange($event)"
        (deliveryUnitChange)="onDeliveryUnitChange($event)"
      ></app-team-organization>

      <app-additionalinfo (addedFieldsChange)="additionalFields = $event"></app-additionalinfo>
    </div>

    <!-- Right Section - Project Preview Component -->
    <app-project-preview
      [projectName]="projectName"
      [projectKey]="projectKey"
      [organisationName]="organisationName"
      [pocEmail]="pocEmail"
      [phoneNumber]="phoneNumber"
      [manager]="manager"
      [deliveryUnit]="deliveryUnit"
      (createProject)="onCreateProject()"
      (cancel)="onCancel()"
    ></app-project-preview>
  </div>
</div>
