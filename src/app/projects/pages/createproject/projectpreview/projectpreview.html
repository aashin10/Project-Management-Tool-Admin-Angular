
<div class="sticky top-20 max-h-[calc(100vh-5rem)] overflow-auto p-6 bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col items-stretch h-fit">
  <!-- Header -->
  <div class="flex items-center gap-2 mb-4">
    <span class="text-blue-600 text-sm">●</span>
    <h2 class="text-lg font-semibold text-gray-900">Project Preview</h2>
  </div>

  <!-- Preview Content -->
  <div class="flex items-center gap-4 mb-6">
    <div class="flex items-center justify-center w-14 h-14 rounded-full bg-gray-100 border border-gray-300">
      <span class="text-xl font-bold text-gray-700">{{ getInitials() }}</span>
    </div>
    <div>
      <h3 class="text-base font-semibold text-gray-900">{{ projectName || 'Project Name' }}</h3>
      <p class="text-sm text-gray-500">{{ projectKey || 'PRJ-001' }}</p>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="flex flex-col gap-2 mt-auto">
    <button class="w-full py-2 px-4 bg-blue-600 text-white rounded font-semibold shadow hover:bg-blue-700 transition-colors" (click)="createProject.emit()">Create Project</button>
    <button class="w-full py-2 px-4 bg-transparent text-gray-500 rounded font-semibold hover:text-gray-700 transition-colors" (click)="cancel.emit()">Cancel</button>
  </div>
</div>
