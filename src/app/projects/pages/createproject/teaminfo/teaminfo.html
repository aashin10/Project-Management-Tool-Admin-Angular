
<div class="bg-white rounded-lg p-6 shadow-sm border border-gray-200">
  <!-- Header -->
  <div class="flex items-center gap-2 mb-2">
    <span class="text-blue-600 text-sm">●</span>
    <h2 class="text-lg font-semibold text-gray-900">Team & Organization</h2>
  </div>
  <p class="text-gray-500 text-sm mb-6">Assign leadership and organizational structure</p>
  <!-- <div class="h-6"></div> -->
  <div class="flex gap-4 mb-1">
      <div class="flex-1 min-w-[220px]">
      <label for="manager" class="block text-sm font-medium text-gray-700 mb-1">
        Project Manager <span class="text-red-500">*</span>
      </label>
      <div class="h-1"></div>
        <div class="relative">
          <!-- <input id="managerInput" type="text" class="w-[220px] h-9 px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-200" placeholder="Search Project Manager"
            [(ngModel)]="manager" (ngModelChange)="onManagerInput($event)" autocomplete="off" /> -->
            
            <input
              type="text"
              id="managerInput"
              name="manager"
              placeholder="Select project manager"
              [(ngModel)]="manager"
              #managerRef="ngModel"
              (ngModelChange)="onManagerInput($event)"
              autocomplete="off"
              required
              class="w-[220px] h-9 px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 placeholder:text-gray-400 font-normal placeholder:font-normal"
              [ngClass]="manager === '' ? 'text-gray-400' : 'text-black'"
            />
            <div *ngIf="managerRef.invalid && managerRef.touched" class="text-red-600 text-xs mt-1">Project Manager is required.</div>


          <!-- <button *ngIf="manager" type="button" (click)="clearManager()" class="absolute right-1 top-1 text-gray-400 hover:text-gray-600" aria-label="Clear manager">
            <img src="/images/deleteUser.svg" alt="clear" class="w-4 h-4" />
          </button> -->

          <ul *ngIf="showManagerSuggestions" class="absolute z-40 left-0 right-0 mt-1 max-h-56 overflow-auto rounded-md bg-white border border-gray-200 shadow-lg">
            <li *ngFor="let u of filteredManagers" (click)="selectManager(u)" class="px-3 py-2 hover:bg-indigo-50 cursor-pointer text-sm text-gray-800 flex flex-col">
              <span class="font-medium">{{ u.user }}</span>
              <span class="text-xs text-gray-500">{{ u.email }}</span>
            </li>
          </ul>
        </div>
    </div>
      <div class="flex-1 min-w-[220px]">
      <label for="deliveryUnit" class="block text-sm font-medium text-gray-700 mb-1">
        Delivery Unit <span class="text-red-500">*</span>
      </label>
      <div class="h-1"></div>
      <select 
        id="deliveryUnit" 
        name="deliveryUnit"
        [(ngModel)]="deliveryUnit" 
        #duRef="ngModel"
        (ngModelChange)="deliveryUnitChange.emit($event)"
        required
        class="w-[220px] h-9 px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 font-normal"
        [ngClass]="deliveryUnit === '' ? 'text-gray-400' : 'text-black'"
      >
        <option value="" class="text-gray-400" style="font-weight:400">Select delivery unit</option>
        <option *ngFor="let du of deliveryUnits" [value]="du.duCode" class="text-black">{{ du.duInfo.name }} — {{ du.duInfo.subtitle }}</option>
      </select>
      <div *ngIf="duRef.invalid && duRef.touched" class="text-red-600 text-xs mt-1">Delivery Unit is required.</div>
    </div>
  </div>
</div>
