<div class="bg-white rounded-lg p-6 shadow-sm border border-gray-200">
  <!-- Header -->
  <div class="flex items-center gap-2 mb-2">
    <span class="text-blue-600 text-sm">●</span>
    <h2 class="text-lg font-semibold text-gray-900">Basic Information</h2>
  </div>
  <p class="text-gray-500 text-sm mb-6">
    Essential project details and identification
  </p>
  <!-- <div class="h-2"></div> -->

  <!-- Row: Project Name & Project Key -->
  <div class="flex gap-6 mb-6">
    <div class="flex-1 min-w-[220px]">
      <label for="projectName" class="block text-sm font-medium text-gray-700 mb-1">
        Project Name <span class="text-red-500">*</span>
      </label>
      <div class="h-2"></div>
      <input 
        type="text" 
        id="projectName" 
        placeholder="Enter project name"
        [(ngModel)]="projectName"
        (input)="onProjectNameChange()"
        class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 placeholder:text-gray-400"
      >
    </div>
    <div class="flex-1 min-w-[220px]">
      <label for="projectKey" class="block text-sm font-medium text-gray-700 mb-1">
        Project Key <span class="text-red-500">*</span>
      </label>
      <div class="h-2"></div>
      <input 
        type="text" 
        id="projectKey" 
        placeholder="Auto-generated from name"
        [(ngModel)]="projectKey"
        class="w-full px-3 py-2 border border-gray-300 rounded bg-gray-100 text-sm text-gray-600 placeholder:text-gray-400"
      >
      <small class="block mt-1 text-xs text-gray-400">
        Format: PRJ-001. Auto-generated if empty.
      </small>
    </div>
  </div>
  <!-- <div class="h-3"></div> -->

  <!-- Project Description -->
  <div class="mb-6">
    <label for="description" class="block text-sm font-medium text-gray-700 mb-1">
      Project Description
    </label>
    <div class="h-2"></div>
    <textarea 
      id="description" 
      placeholder="Describe the project goals, scope, and key objectives..."
      [(ngModel)]="description"
      class="w-full px-3 py-2 border border-gray-300 rounded text-sm min-h-[80px] resize-y focus:outline-none focus:ring-2 focus:ring-blue-200 placeholder:text-gray-400"
    ></textarea>
  </div>
  <!-- <div class="h-5"></div> -->

  <!-- Row: Priority & Status -->
  <div class="flex gap-6">
    <div class="flex-1 min-w-[220px]">
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Priority Level <span class="text-red-500">*</span>
      </label>
      <div class="h-2"></div>
      <div class="relative">
        <button type="button"
          class="w-full flex items-center justify-between px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 bg-white"
          (click)="togglePriorityDropdown()"
        >
          <span class="flex items-center gap-2" [ngClass]="selectedPriority.value === '' ? 'text-gray-400' : 'text-black'">
            <span *ngIf="selectedPriority.value" class="inline-block w-2 h-2 rounded-full" [ngStyle]="{background: selectedPriority.color}"></span>
            {{ selectedPriority.label }}
          </span>
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
        </button>
        <ul *ngIf="priorityDropdownOpen" class="absolute z-10 w-full mt-1 bg-white border border-gray-200 rounded shadow-lg">
          <li *ngFor="let opt of priorityOptions" (click)="selectPriority(opt.value)"
            class="flex items-center gap-2 px-3 py-2 cursor-pointer hover:bg-gray-100 text-sm"
            [ngClass]="opt.value === '' ? 'text-gray-400' : 'text-black'"
          >
            <span *ngIf="opt.value" class="inline-block w-2 h-2 rounded-full" [ngStyle]="{background: opt.color}"></span>
            {{ opt.label }}
          </li>
        </ul>
      </div>
    </div>
    <div class="flex-1 min-w-[220px]">
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Initial Status
      </label>
      <div class="h-2"></div>
      <div class="relative">
        <button type="button"
          class="w-full flex items-center justify-between px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 bg-white"
          (click)="toggleStatusDropdown()"
        >
          <span class="flex items-center gap-2" [ngClass]="selectedStatus.value === '' ? 'text-gray-400' : 'text-black'">
            <span *ngIf="selectedStatus.value" class="inline-block w-2 h-2 rounded-full" [ngStyle]="{background: selectedStatus.color}"></span>
            {{ selectedStatus.label }}
          </span>
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
        </button>
        <ul *ngIf="statusDropdownOpen" class="absolute z-10 w-full mt-1 bg-white border border-gray-200 rounded shadow-lg">
          <li *ngFor="let opt of statusOptions" (click)="selectStatus(opt.value)"
            class="flex items-center gap-2 px-3 py-2 cursor-pointer hover:bg-gray-100 text-sm"
            [ngClass]="opt.value === '' ? 'text-gray-400' : 'text-black'"
          >
            <span *ngIf="opt.value" class="inline-block w-2 h-2 rounded-full" [ngStyle]="{background: opt.color}"></span>
            {{ opt.label }}
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
