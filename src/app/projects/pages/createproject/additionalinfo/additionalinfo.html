
<div class="bg-white rounded-lg p-4 shadow-sm border border-gray-200 relative">
	<!-- Header -->
	<div class="flex items-center justify-between mb-2">
		<div class="flex items-center gap-2">
			<span class="text-blue-600 text-sm">●</span>
			<h2 class="text-lg font-semibold text-gray-900">Additional Information</h2>
		</div>
		<app-custom-button
			[label]="'Add Info'"
			[bgClass]="'bg-blue-600'"
			[textColor]="'text-white'"
			[fontWeight]="'font-regular'"
			[rounded]="'rounded'"
			[extraClasses]="'px-4 py-2 shadow'"
			[hoverClass]="'hover:bg-blue-700'"
			(action)="onAddInfo()"
		></app-custom-button>
	</div>
	<!-- Content goes here -->

	<!-- Added fields list (two-column grid on md+) -->
	<div *ngIf="addedFields.length > 0" class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-6">
		<div *ngFor="let f of addedFields; let i = index" class="">
			<label class="block text-sm font-medium text-gray-700 mb-1">{{ f.name | titlecase }}</label>
			<div class="h-2"></div>
			<div class="flex items-center gap-3">
				<input [ngModel]="addedFields[i].value | titlecase" (ngModelChange)="updateFieldValue($event, i)" type="text" class="px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 placeholder:text-gray-400 text-gray-700 w-full" />
				<button (click)="removeField(i)" title="Remove" class="inline-flex items-center justify-center w-8 h-8 rounded hover:bg-red-50">
					<img src="/images/delete-user.svg" alt="Delete" class="w-4 h-4" />
				</button>
			</div>
		</div>
	</div>

	<!-- Modal (shared) -->
	<app-modal [isOpen]="modalOpen" (close)="handleCancel()">
		<div class="p-6">
			<h2 class="text-lg font-semibold text-gray-900 mb-4">Add Additional Info</h2>
			<form>
				<div class="mb-4">
					<label for="fieldName" class="block text-sm font-medium text-gray-600 mb-1">Field Name</label>
					<input id="fieldName" [(ngModel)]="newFieldName" name="fieldName" type="text" class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 placeholder:text-gray-400 text-gray-700" placeholder="Enter field name">
				</div>
				<div class="mb-6">
					<label for="fieldValue" class="block text-sm font-medium text-gray-700 mb-1">Field Value</label>
					<input id="fieldValue" [(ngModel)]="newFieldValue" name="fieldValue" type="text" class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 placeholder:text-gray-400 text-gray-700" placeholder="Enter value">
				</div>
				<div class="flex gap-3 justify-end">
					<app-custom-button
						[label]="'Add'"
						[bgClass]="'bg-blue-600'"
						[textColor]="'text-white'"
						[fontWeight]="'font-semibold'"
						[rounded]="'rounded-lg'"
						[extraClasses]="'px-4 py-2 shadow'"
						[hoverClass]="'hover:bg-blue-700'"
						[disabled]="!newFieldName || !newFieldValue"
						(action)="addFromModal()"
					></app-custom-button>
					<app-custom-button
						[label]="'Cancel'"
						[bgClass]="'bg-gray-100'"
						[textColor]="'text-gray-700'"
						[fontWeight]="'font-semibold'"
						[rounded]="'rounded-lg'"
						[extraClasses]="'px-4 py-2 border border-gray-300'"
						[hoverClass]="'hover:bg-gray-200'"
						(action)="handleCancel()"
					></app-custom-button>
				</div>
			</form>
		</div>
	</app-modal>
</div>
