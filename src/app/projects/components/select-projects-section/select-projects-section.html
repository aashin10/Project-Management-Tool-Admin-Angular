<ng-container>
  <div class="flex w-full justify-between">
    <app-search-bar
      class="w-full"
      [placeholder]="'Select Projects..'"
      (search)="onSearch($event)"
    ></app-search-bar>
    <app-custom-button
      label="Select All"
      shortLabel="Select All"
      bgClass="border border-gray-300 hover:bg-gray-50 ml-4"
      (action)="selectAllProjects()"
    ></app-custom-button>
  </div>

  <div *ngIf="loadingProjects" class="flex justify-center items-center h-32">
    <app-loading-indicator></app-loading-indicator>
  </div>

  <app-importprojectslist
    *ngIf="!loadingProjects"
    class="w-full"
    [projects]="projects"
  ></app-importprojectslist>

  <app-custom-button
    label="Import Selected Projects"
    shortLabel="Import"
    bgClass="bg-[#0052cc] border border-gray-300 w-full"
    [hoverClass]="'hover:bg-[#0052cce6]'"
    [textColor]="'text-white'"
    class="w-full"
    [icon]="'/images/import.svg'"
  ></app-custom-button>
</ng-container>
