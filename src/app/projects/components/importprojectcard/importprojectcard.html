<div
  class="flex gap-4 p-4 border border-gray-200 rounded-lg shadow-sm hover:shadow-md transition w-full mt-2 mb-2"
  [ngClass]="{ 'bg-blue-50 border-blue-400': selected }"
>
  <input type="checkbox" (change)="onSelect()" [checked]="selected" class="mt-1 accent-blue-600" />

  <div class="flex flex-col items-start">
    <div class="flex items-center gap-2">
      <h2 class="text-lg font-semibold text-gray-800">{{ title }}</h2>
    </div>

    <p class="text-sm text-gray-600 mt-1">{{ key }}</p>
    <p class="text-sm text-gray-600 mt-1">{{ id }}</p>
  </div>
</div>
