<div class="bg-white rounded-xl border {{ borderColor }} p-6 hover:shadow-lg transition-all duration-300 cursor-pointer group">
  <!-- Header with Icon and Title -->
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <div class="{{ iconBgColor }} {{ iconColor }} p-2.5 rounded-lg group-hover:scale-110 transition-transform duration-300" [innerHTML]="icon"></div>
      <h3 class="text-sm font-medium text-gray-600">{{ title }}</h3>
    </div>
    
    <!-- Trend Indicator (if available) -->
    <div *ngIf="trend" class="flex items-center gap-1 {{ trendColor }} text-xs font-semibold bg-emerald-50 px-2 py-1 rounded-full">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
      </svg>
      <span>{{ trend }}</span>
    </div>

    <!-- Warning Indicator for On Hold -->
    <div *ngIf="!trend && title === 'On Hold Projects'" class="text-amber-500">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    </div>
  </div>

  <!-- Value Display -->
  <div class="flex items-end justify-between">
    <p class="text-4xl font-bold text-gray-900 group-hover:text-blue-600 transition-colors duration-300">{{ value }}</p>
  </div>
</div>
