<div 
  (click)="handleCardClick()"
  class="bg-white rounded-xl border {{ borderColor }} p-6 hover:shadow-lg transition-all duration-300 cursor-pointer group">
  <!-- Header with Icon and Title -->
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <div><img [src]="icon" alt="icon" class="w-6 h-6" [ngClass]="iconColor" /></div>
      <h3 class="text-sm font-medium text-gray-600">{{ title }}</h3>
    </div>
    
    <!-- Trend Indicator (if available) -->
    <!-- Warning Indicator for On Hold -->

  </div>

  <!-- Value Display -->
  <div class="flex items-end justify-between">
    <p class="text-4xl font-bold text-gray-900 group-hover:text-blue-600 transition-colors duration-300">{{ value }}</p>
  </div>
</div>
