<div class="min-h-screen p-6">
  <!-- Header Section -->
  <div class="mb-8">
    <div class="flex items-center justify-between">
      <div>
        <div class="flex items-center gap-3 mb-2">
          <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
          </div>
          <h1 class="text-3xl font-bold text-gray-900">Welcome back</h1>
        </div>
        <p class="text-gray-500 text-sm">Comprehensive overview of projects, activity timeline, and system performance</p>
      </div>
      <button class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        Redirect to User Side
      </button>
    </div>
  </div>

  <!-- Metric Cards Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
    <app-dashboard-metric-card
      *ngFor="let card of metricCards"
      [title]="card.title"
      [value]="card.value"
      [icon]="card.icon"
      [iconBgColor]="card.iconBgColor"
      [iconColor]="card.iconColor"
      [trend]="card.trend"
      [trendColor]="card.trendColor"
      [borderColor]="card.borderColor">
    </app-dashboard-metric-card>
  </div>

  <!-- Charts Section -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <!-- Project Activity Timeline (takes 2 columns) -->
    <div class="lg:col-span-2">
      <app-project-activity-timeline [chartData]="chartData"></app-project-activity-timeline>
    </div>

    <!-- Project Status (takes 1 column) - UPDATED -->
    <div class="lg:col-span-1">
      <app-project-status [statusData]="projectStatusData"></app-project-status>
    </div>
  </div>
</div>
