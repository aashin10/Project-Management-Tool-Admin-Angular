<div class="bg-white rounded-xl min-h-[550px] border border-gray-200 p-6 shadow-sm hover:shadow-md transition-shadow duration-300">
  <!-- Header -->
  <div class="flex items-start justify-between mb-6">
    <div>
      <div class="flex items-center gap-2 mb-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
        </svg>
        <h3 class="text-lg font-semibold text-gray-900">Project Activity Timeline</h3>
      </div>
      <p class="text-sm text-gray-500">Track project creation trends over time</p>
    </div>
    
    <!-- Period Dropdown -->
    <div class="relative">
      <button 
        (click)="toggleDropdown()"
        class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors duration-200 shadow-sm">
        {{ selectedPeriod }}
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 transition-transform duration-200" 
             [class.rotate-180]="showDropdown" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
      
      <div *ngIf="showDropdown" 
           class="absolute right-0 mt-2 w-40 bg-white border border-gray-200 rounded-lg shadow-lg z-10 animate-fade-in">
        <div class="py-1">
          <button
            *ngFor="let period of periods"
            (click)="selectPeriod(period)"
            [class.bg-blue-50]="period === selectedPeriod"
            [class.text-blue-600]="period === selectedPeriod"
            [class.font-medium]="period === selectedPeriod"
            class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors duration-150 first:rounded-t-lg last:rounded-b-lg">
            {{ period }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Chart Container -->
  <div class="chart-container">
    <apx-chart
      [series]="chart?.series"
      [chart]="chart?.chart"
      [dataLabels]="chart?.dataLabels"
      [stroke]="chart?.stroke"
      [grid]="chart?.grid"
      [markers]="chart?.markers"
      [xaxis]="chart?.xaxis"
      [yaxis]="chart?.yaxis"
      [tooltip]="chart?.tooltip"
      [colors]="chart?.colors"
      [fill]="chart?.fill"
      height="350">
    </apx-chart>
  </div>

  <!-- Summary Stats -->
  <div class="mt-4 pt-4 border-t border-gray-100">
    <div class="flex items-center justify-between text-sm text-gray-600">
      <span>Current Period: {{ selectedPeriod }}</span>
      <span class="font-medium text-blue-600">
        Total: {{ getTotalProjects() }} projects
      </span>
    </div>
  </div>
</div>
