<div class="flex">
  <app-sectiontitle
    title="User Management"
    description="Manage user accounts and permissions"
  ></app-sectiontitle>

  <app-custom-button
    label="Export"
    (click)="onExport()"
    [bgClass]="'bg-white'"
    [hoverClass]="'hover:bg-gray-100'"
    class="ml-auto"
    [extraClasses]="'mr-2 mt-4'"
    [icon]="'images/export.svg'"
    [fontSize]="'text-[14px]'"
  ></app-custom-button>

  <app-custom-button
    label="Bulk Import"
    (click)="onImport()"
    [bgClass]="'bg-white'"
    [hoverClass]="'hover:bg-gray-100'"
    [fontSize]="'text-base'"
    [icon]="'images/import.svg'"
    [extraClasses]="'mr-2 mt-4'"
    [fontSize]="'text-[14px]'"
  ></app-custom-button>

  <app-custom-button
    label="Add User"
    (click)="onAddUser()"
    [bgClass]="'bg-[#0052CC]'"
    [hoverClass]="'hover:bg-[#0052cce6]'"
    [textColor]="'text-white'"
    [extraClasses]="'font-bold mt-4'"
    [fontSize]="'text-base'"
    [icon]="'images/plus.svg'"
    [fontSize]="'text-[14px]'"
  ></app-custom-button>
</div>

<div class="flex">
  <app-search-bar placeholder="Search users..." class="w-full max-w-md"></app-search-bar>
  <app-custom-button
    label="Advanced Filter"
    (click)="onAdvancedFilter()"
    [bgClass]="'bg-white'"
    [hoverClass]="'hover:bg-gray-100'"
    class="ml-auto"
    [extraClasses]="'mt-0.5'"
    [icon]="'images/filter.svg'"
    [fontSize]="'text-[14px]'"
  ></app-custom-button>
</div>

<!-- Advanced Filter Panel -->
<div
  *ngIf="showAdvancedFilter"
  class="w-full bg-[rgba(220,224,231,0.05)] border border-gray-200 rounded-md p-4 mt-4 flex flex-col gap-4 animate-fade-in"
>
  <div class="flex flex-wrap gap-6">
    <!-- Type Filter -->
    <div class="flex flex-col space-y-2">
      <label class="text-sm font-medium">Type</label>
      <div class="relative w-48">
        <button
          type="button"
          (click)="showTypeDropdown = !showTypeDropdown"
          class="flex w-full items-center justify-between gap-2 border border-gray-300 bg-white px-3 py-2 text-sm whitespace-nowrap transition-colors outline-none focus:ring-2 focus:ring-[#0052CC] focus:border-[#0052CC] rounded-none h-9"
        >
          <span>{{ getTypeLabel() }}</span>
          <svg
            class="w-4 h-4 text-gray-400"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            viewBox="0 0 24 24"
          >
            <path d="m6 9 6 6 6-6"></path>
          </svg>
        </button>
        <div
          *ngIf="showTypeDropdown"
          class="absolute z-10 mt-1 w-full bg-white border border-gray-200 shadow-lg rounded-none"
        >
          <div
            (click)="selectType('')"
            [ngClass]="{ 'bg-[#0052CC] text-white': filterType === '' }"
            class="px-3 py-2 text-sm cursor-pointer hover:bg-[#0052CC] hover:text-white transition-colors select-none"
          >
            All Types
          </div>
          <div
            *ngFor="let opt of typeOptions"
            (click)="selectType(opt.value)"
            [ngClass]="{ 'bg-[#0052CC] text-white': filterType === opt.value }"
            class="px-3 py-2 text-sm cursor-pointer hover:bg-[#0052CC] hover:text-white transition-colors select-none"
          >
            {{ opt.label }}
          </div>
        </div>
      </div>
    </div>
    <!-- Status Filter -->
    <div class="flex flex-col space-y-2">
      <label class="text-sm font-medium">Status</label>
      <div class="relative w-48">
        <button
          type="button"
          (click)="showStatusDropdown = !showStatusDropdown"
          class="flex w-full items-center justify-between gap-2 border border-gray-300 bg-white px-3 py-2 text-sm whitespace-nowrap transition-colors outline-none focus:ring-2 focus:ring-[#0052CC] focus:border-[#0052CC] rounded-none h-9"
        >
          <span>{{ getStatusLabel() }}</span>
          <svg
            class="w-4 h-4 text-gray-400"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            viewBox="0 0 24 24"
          >
            <path d="m6 9 6 6 6-6"></path>
          </svg>
        </button>
        <div
          *ngIf="showStatusDropdown"
          class="absolute z-10 mt-1 w-full bg-white border border-gray-200 shadow-lg rounded-none"
        >
          <div
            (click)="selectStatus('')"
            [ngClass]="{ 'bg-[#0052CC] text-white': filterStatus === '' }"
            class="px-3 py-2 text-sm cursor-pointer hover:bg-[#0052CC] hover:text-white transition-colors select-none"
          >
            All Status
          </div>
          <div
            *ngFor="let opt of statusOptions"
            (click)="selectStatus(opt.value)"
            [ngClass]="{ 'bg-[#0052CC] text-white': filterStatus === opt.value }"
            class="px-3 py-2 text-sm cursor-pointer hover:bg-[#0052CC] hover:text-white transition-colors select-none"
          >
            {{ opt.label }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
