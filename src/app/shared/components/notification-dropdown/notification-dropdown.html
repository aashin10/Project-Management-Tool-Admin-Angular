<div class="notification-dropdown w-80 max-h-96 bg-white rounded-sm shadow-lg border border-gray-200 overflow-hidden">
  <!-- Header -->
  <div class="flex items-center justify-between p-4 border-b border-gray-200 bg-gray-50">
    <h3 class="text-lg font-semibold text-gray-900">
      Notifications
      <span *ngIf="unreadCount > 0" class="ml-2 inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
        {{ unreadCount }}
      </span>
    </h3>
    <div class="flex items-center space-x-2">
      <button
        *ngIf="notifications.length > 0"
        (click)="markAllAsRead()"
        class="text-sm text-blue-600 hover:text-blue-800 font-medium"
        title="Mark all as read"
      >
        <lucide-icon [img]="CheckCheckIcon" class="w-4 h-4"></lucide-icon>
      </button>
      <button
        *ngIf="notifications.length > 0"
        (click)="clearAllNotifications()"
        class="text-sm text-red-600 hover:text-red-800 font-medium"
        title="Clear all"
      >
        <lucide-icon [img]="XIcon" class="w-4 h-4"></lucide-icon>
      </button>
    </div>
  </div>

  <!-- Notifications List -->
  <div class="max-h-80 overflow-y-auto">
    <div *ngIf="notifications.length === 0" class="p-6 text-center text-gray-500">
      <lucide-icon [img]="CheckIcon" class="w-12 h-12 mx-auto mb-3 text-gray-300"></lucide-icon>
      <p class="text-sm">No notifications yet</p>
    </div>

    <div *ngFor="let notification of notifications" class="border-b border-gray-100 last:border-b-0">
      <div
        class="p-4 hover:bg-gray-50 cursor-pointer transition-colors"
        [ngClass]="getNotificationClass(notification.type)"
        (click)="markAsRead(notification.id)"
      >
        <div class="flex items-start space-x-3">
          <!-- Notification Icon -->
          <div class="flex-shrink-0">
            <div
              class="w-6 h-6 rounded-full flex items-center justify-center"
              [ngClass]="{
                'bg-green-100': notification.type === 'success',
                'bg-red-100': notification.type === 'error',
                'bg-yellow-100': notification.type === 'warning',
                'bg-blue-100': notification.type === 'info'
              }"
            >
              <div
                class="w-3 h-3 rounded-full"
                [ngClass]="{
                  'bg-green-500': notification.type === 'success',
                  'bg-red-500': notification.type === 'error',
                  'bg-yellow-500': notification.type === 'warning',
                  'bg-blue-500': notification.type === 'info'
                }"
              ></div>
            </div>
          </div>

          <!-- Notification Content -->
          <div class="flex-1 min-w-0">
            <div class="flex items-start justify-between">
              <div class="flex-1">
                <p *ngIf="notification.title" class="text-sm font-medium text-gray-900">
                  {{ notification.title }}
                </p>
                <p class="text-sm text-gray-700">
                  {{ notification.message }}
                </p>
                <p class="text-xs text-gray-500 mt-1">
                  {{ formatTimestamp(notification.timestamp) }}
                </p>
              </div>

              <!-- Unread indicator -->
              <div *ngIf="!notification.read" class="flex-shrink-0">
                <div class="w-2 h-2 bg-blue-500 rounded-full"></div>
              </div>
            </div>
          </div>

          <!-- Remove button -->
          <button
            (click)="removeNotification(notification.id); $event.stopPropagation()"
            class="flex-shrink-0 text-gray-400 hover:text-gray-600 p-1"
            title="Remove notification"
          >
            <lucide-icon [img]="XIcon" class="w-4 h-4"></lucide-icon>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div *ngIf="notifications.length > 0" class="p-3 bg-gray-50 border-t border-gray-200">
    <button
      (click)="clearAllNotifications()"
      class="w-full text-center text-sm text-red-600 hover:text-red-800 font-medium"
    >
      Clear All Notifications
    </button>
  </div>
</div>
