<div class="relative w-full">
  <!-- Search Icon on the Left -->
  <div class="absolute inset-y-0 left-0 flex items-center pl-2 pointer-events-none">
    <svg class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
      />
    </svg>
  </div>

  <!-- Input Field with Reduced Padding -->
  <input
    type="text"
    [(ngModel)]="searchQuery"
    (input)="onSearch()"
    [placeholder]="placeholder"
    class="w-full pl-8 pr-4 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-transparent text-sm placeholder-gray-400 bg-gray-100 text-gray-800"
  />
</div>
