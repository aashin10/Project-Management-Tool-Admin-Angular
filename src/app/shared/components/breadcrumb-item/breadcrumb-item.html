<nav aria-label="breadcrumb" class="overflow-x-auto">
  <ol class="flex items-center space-x-2 whitespace-nowrap">
    <li *ngFor="let item of items; let last = last" class="flex items-center">
      <a
        [href]="item.url"
        [class]="
          last || item.active
            ? 'text-gray-900 font-medium text-sm'
            : 'text-gray-500 hover:text-gray-700 text-sm'
        "
      >
        {{ item.label }}
      </a>
      <svg
        *ngIf="!last"
        class="h-5 w-5 text-gray-400 mx-1 flex-shrink-0"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </li>
  </ol>
</nav>
