<div class="dropdown-menu">
  <!-- User Info Section -->
  <div class="px-4 py-4 border-b border-gray-200 bg-gray-50">
    <div class="flex flex-col space-y-1">
      <p class="text-sm font-semibold text-gray-900">{{ user.name }}</p>
      <p class="text-xs text-gray-600">{{ user.email }}</p>
    </div>
  </div>

  <!-- Menu Items -->
  <div class="py-2">
    <button
      *ngFor="let item of menuItems"
      (click)="onMenuItemClick(item)"
      type="button"
      class="w-full flex items-center gap-3 px-4 py-3 text-sm font-medium transition-colors duration-150"
      [class.text-red-600]="item.destructive"
      [class.hover:bg-red-50]="item.destructive"
      [class.hover:bg-blue-50]="!item.destructive"
      [class.text-gray-700]="!item.destructive"
    >
      <img [src]="item.icon" class="h-4 w-4" alt="" />
      <span>{{ item.label }}</span>
    </button>
  </div>
</div>
