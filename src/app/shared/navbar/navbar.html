<nav class="bg-white shadow-sm">
  <div class="max-w-full mx-auto px-4 sm:px-6 lg:px-8">
    <div
      class="flex flex-row lg:justify-between lg:items-center py-3 lg:py-0 lg:h-16 gap-3 lg:gap-4"
    >
      <!-- Search Bar -->
      <div class="w-full lg:max-w-lg flex-shrink">
        <app-search-bar
          [placeholder]="'Search Projects and Users...'"
          (search)="onSearch($event)"
        ></app-search-bar>
      </div>

      <!-- Action Icons -->
      <div class="flex items-center justify-end flex-shrink-0">
        <app-action-buttons
          (actionClick)="onActionClick($event)"
          [unreadNotificationCount]="unreadNotificationCount"
        ></app-action-buttons>
      </div>
    </div>
  </div>
  <div class="relative">
    <div *ngIf="isUserMenuVisible" class="absolute right-1 mt-1">
      <app-user-menu></app-user-menu>
    </div>
  </div>
</nav>

<!-- Notification Dropdown -->
<div class="relative">
  <div *ngIf="isNotificationDropdownVisible" class="absolute right-1 mt-1 z-50">
    <app-notification-dropdown></app-notification-dropdown>
  </div>
</div>

<div class="relative">
  <div
    *ngIf="isSearchBarVisible && searchResults"
    class="absolute z-10 w-full lg:max-w-2xl bg-white p-4 space-y-6 border border-gray-300 shadow-lg border-l-0"
  >
    <!-- Projects -->
    <div *ngIf="searchResults.projects?.length">
      <h3 class="text-lg font-semibold text-gray-600">Projects</h3>
      <ul class="">
        <li *ngFor="let project of searchResults.projects" class="py-1 text-sm">
          <a [routerLink]="['/projects', project.id]" class="text-blue-600 hover:underline">
            {{ project.name }}
          </a>
        </li>
      </ul>
    </div>

    <!-- Users -->
    <div *ngIf="searchResults.users?.length">
      <h3 class="text-lg font-semibold text-gray-600">Users</h3>
      <ul class="">
        <li *ngFor="let user of searchResults.users" class="py-1 text-sm">
          <a
            [routerLink]="['/users']"
            [queryParams]="{ name: user.name }"
            class="text-blue-600 hover:underline"
          >
            {{ user.name }}
          </a>
        </li>
      </ul>
    </div>
  </div>
</div>
