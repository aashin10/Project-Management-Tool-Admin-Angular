<!-- Sidebar Container -->
<div class="w-[255px] h-screen bg-white text-gray-800 flex flex-col border-r border-gray-200">
  <!-- Sidebar Header with Logo -->
  <app-sidebar-header></app-sidebar-header>

  <!-- Sidebar Menu -->
  <nav class="flex-1 overflow-y-auto p-3 text-sm">
    <ul class="space-y-1">

      <!-- Dashboard -->
      <app-sidebar-single-section [icon]="dashboardIcon" label="Dashboard" route="/dashboard">
      </app-sidebar-single-section>

      <!-- Projects -->
      <app-sidebar-single-section [icon]="projectsIcon" label="Projects" route="/projects">
      </app-sidebar-single-section>

      <!-- DU Management -->
      <app-sidebar-single-section [icon]="buildingIcon" label="DU Management" route="/deliveryunits">
      </app-sidebar-single-section>

      <!-- User Management -->
      <app-sidebar-single-section [icon]="userIcon" label="User Management" route="/users">
      </app-sidebar-single-section>

      <!-- Roles & Permissions -->
      <app-sidebar-single-section [icon]="shieldIcon" label="Roles & Permissions" route="/roles">
      </app-sidebar-single-section>

      <!-- Reports -->
      <app-sidebar-single-section [icon]="reportsIcon" label="Reports" route="/reports">
      </app-sidebar-single-section>

      <!-- Settings -->
      <app-sidebar-single-section [icon]="settingsIcon" label="Settings" route="/settings">
      </app-sidebar-single-section>

    </ul>
  </nav>
</div>
