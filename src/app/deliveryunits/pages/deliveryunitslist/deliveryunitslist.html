<div class="content-area">
  <!-- Header Section -->
  <div class="header">
    <div class="header-content">
      <div class="flex items-start justify-between mb-6">
        <div class="flex items-start gap-4">
          <div>
            <app-sectiontitle
              title="DU Management"
              description="Manage Delivery Units and organizational structure"
            ></app-sectiontitle>
          </div>
        </div>
        <app-custom-button
          [icon]="'images/plus.svg'"
          label="Add New DU"
          [bgClass]="'bg-blue-600'"
          [textColor]="'text-white'"
          [hoverClass]="'hover:bg-blue-700'"
          [borderClass]="'border-0'"
          (action)="onAddNewDU()"
        ></app-custom-button>
      </div>

      <!-- Search Bar -->
      <app-search-bar
        [placeholder]="'Search delivery units by name, code, description, or head...'"
        [backgroundColor]="'bg-white'"
        [border]="'border'"
        [borderColor]="'border-gray-200'"
        [height]="'py-3'"
        (searchChange)="onSearchChange($event)"
      ></app-search-bar>
    </div>
  </div>

  <!-- Table -->
  <app-table
    [columns]="columns"
    [data]="filteredDeliveryUnits"
    [showCheckbox]="true"
    [itemsPerPage]="10"
    (actionClick)="onActionClick($event)"
  >
  </app-table>

  <!-- Add Delivery Unit Modal -->
  <app-modal [isOpen]="isModalOpen" (close)="onCloseModal()">
    <div class="p-6">
      <!-- Modal Header -->
      <div class="flex items-start gap-3 mb-6">
        <div
          class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center flex-shrink-0"
        >
          <svg class="w-5 h-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"
            />
          </svg>
        </div>
        <div>
          <h2 class="text-xl font-semibold text-gray-900">Add New Delivery Unit</h2>
          <p class="text-sm text-gray-500 mt-1">
            Create a new delivery unit to organize your teams and projects
          </p>
        </div>
      </div>

      <!-- Form Content -->
      <form (ngSubmit)="onCreateDeliveryUnit($event)" class="space-y-4">
        <!-- DU Name and Code Row -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              DU Name <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              [(ngModel)]="newDU.name"
              name="name"
              placeholder="e.g., Engineering, Marketing"
              (input)="onDUNameChange()"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none placeholder:text-gray-400"
              required
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              DU Code <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              [(ngModel)]="newDU.code"
              name="code"
              placeholder="e.g., ENG-001, PM-002"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none uppercase placeholder:text-gray-400"
              required
            />
            <p class="text-xs text-gray-500 mt-1">
              Format: 2-4 letters, dash, 3 digits (e.g., ENG-001)
            </p>
          </div>
        </div>

        <!-- Description -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Description <span class="text-red-500">*</span>
          </label>
          <textarea
            rows="3"
            [(ngModel)]="newDU.description"
            name="description"
            placeholder="Describe the delivery unit's purpose and responsibilities..."
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize- placeholder:text-gray-400"
            required
          ></textarea>
        </div>

        <!-- DU Head Information -->
        <div class="pt-4 border-t border-gray-200">
          <div class="flex items-center gap-2 mb-4">
            <svg
              class="w-5 h-5 text-gray-400"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
            <h3 class="text-sm font-semibold text-gray-900">DU Head Information</h3>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Head Name <span class="text-red-500">*</span>
              </label>
              <input
                type="text"
                [(ngModel)]="newDU.headName"
                name="headName"
                placeholder="e.g., John Smith"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none placeholder:text-gray-400"
                required
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Head Email <span class="text-red-500">*</span>
              </label>
              <input
                type="email"
                [(ngModel)]="newDU.headEmail"
                name="headEmail"
                placeholder="john.smith@company.com"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none placeholder:text-gray-400"
                required
              />
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-end gap-3 pt-4">
          <button
            type="button"
            (click)="onCloseModal()"
            class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors"
          >
            Create Delivery Unit
          </button>
        </div>
      </form>
    </div>
  </app-modal>
</div>
