<div class="p-6">
  <!-- Header with Title and Create Button -->
  <div class="flex justify-between items-center mb-6">
    <app-sectiontitle
      title="All Roles"
      description="Manage user roles and permissions across your organization">
    </app-sectiontitle>
    
    <app-custom-button
      label="Create Role"
      variant="primary"
      [bgClass]="'bg-[#0052CC]'"
      [hoverClass]="'hover:bg-[#0052cce6]'"
      [textColor]="'text-white'"
      [extraClasses]="'font-bold'"
      [icon]="'images/plus.svg'"
      [fontSize]="'text-[14px]'"
      (click)="openModal()">
    </app-custom-button>
  </div>

  <!-- Search Bar -->
  <div class="mb-4">
    <app-search-bar
      placeholder="Search roles..."
      (search)="onSearch($event)">
    </app-search-bar>
  </div>
 
  <!-- Roles Table -->
  <app-table
    [columns]="columns"
    [data]="filteredRoles"
    [showCheckbox]="false"
    (actionClick)="handleTableAction($event)">
  </app-table>
</div>
 
<!-- Modal for Create/Edit Role -->
<app-modal [isOpen]="isModalOpen" (close)="closeModal()">
  <div class="p-5 max-w-xl mx-auto">
    <!-- Modal Header -->
    <div class="flex items-start gap-3 mb-4">
      <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center flex-shrink-0">
        <svg class="w-5 h-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
            d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      </div>
      <div>
        <h2 class="text-xl font-semibold text-gray-900">
          {{ isEditMode ? 'Edit Role' : 'Create New Role' }}
        </h2>
        <p class="text-sm text-gray-500 mt-1">
          {{ isEditMode ? 'Update role details and permissions' : 'Define a new role with specific permissions' }}
        </p>
      </div>
    </div>
 
    <!-- Form Content -->
    <form (ngSubmit)="saveRole()" #roleForm="ngForm" class="space-y-3">
      <!-- Role Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Role Name <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          [(ngModel)]="newRole.roleInfo!.name"
          name="roleName"
          placeholder="e.g., Admin, Manager, Developer"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none placeholder:text-gray-400"
          required
        />
      </div>
 
      <!-- Description -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Description <span class="text-red-500">*</span>
        </label>
        <textarea
          rows="2"
          [(ngModel)]="newRole.description"
          name="description"
          placeholder="Describe the role's purpose and responsibilities..."
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-none placeholder:text-gray-400"
          required
        ></textarea>
      </div>
 
      <!-- Clone From (Optional) -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Clone From (Optional)
        </label>
        <select
          [(ngModel)]="newRole.cloneFrom"
          name="cloneFrom"
          (change)="onCloneFromChange()"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
        >
          <option value="">-- Select a role to clone --</option>
          <option *ngFor="let role of roles" [value]="role.roleInfo.name">
            {{ role.roleInfo.name }}
          </option>
        </select>
      </div>
 
      <!-- Permissions -->
      <div class="pt-3 border-t border-gray-200">
        <div class="flex items-center gap-2 mb-2">
          <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          <h3 class="text-sm font-semibold text-gray-900">Permissions <span class="text-red-500">*</span></h3>
        </div>
 
        <div class="space-y-2 max-h-48 overflow-y-auto">
          <label
            *ngFor="let permission of permissionsList"
            class="flex items-center gap-2 p-2.5 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors"
          >
            <input
              type="checkbox"
              [checked]="newRole.permissions?.includes(permission)"
              (change)="togglePermission(permission)"
              class="rounded border-gray-300 text-blue-600 focus:ring-blue-500"
            />
            <span class="text-sm text-gray-700">{{ permission }}</span>
          </label>
        </div>
      </div>
 
      <!-- Action Buttons -->
      <div class="flex justify-end gap-3 pt-4">
        <!-- Cancel Button -->
        <app-custom-button
          label="Cancel"
          type="button"
          (click)="closeModal()"
          [bgClass]="'bg-white'"
          [hoverClass]="'hover:bg-gray-100'"
          [fontSize]="'text-[14px]'"
          class="border border-gray-300 text-gray-700"
        ></app-custom-button>

        <!-- Submit Button -->
        <button
          type="submit"
          class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors"
        >
          {{ isEditMode ? 'Update Role' : 'Create Role' }}
        </button>
      </div>
    </form>
  </div>
</app-modal>
