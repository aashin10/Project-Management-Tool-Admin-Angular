<app-sectiontitle
  title="All Roles"
  description="Manage user roles and permissions across your organization">
</app-sectiontitle>

<div class="p-6">
  <!-- Search and Create Button -->
  <div class="flex justify-between items-center mb-4">
    <!-- <input type="text" placeholder="Search roles..." class="border rounded px-3 py-2 w-1/3"> -->
     <app-search-bar
        placeholder="Search roles..."
        (search)="onSearch($event)"
        ></app-search-bar>

    <button class="bg-blue-600 text-white px-4 py-2 rounded">+ Create Role</button>
  </div>

  <!-- Roles Table -->
  <table class="w-full border-collapse border border-gray-200">
    <thead class="bg-gray-100">
      <tr>
        <th class="border px-4 py-2 text-left">Role Name</th>
        <th class="border px-4 py-2 text-left">Description</th>
        <th class="border px-4 py-2 text-left">Users</th>
        <th class="border px-4 py-2 text-left">Created</th>
        <th class="border px-4 py-2 text-left">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let role of roles" class="hover:bg-gray-50">
        <td class="border px-4 py-2">{{ role.name }}</td>
        <td class="border px-4 py-2">{{ role.description }}</td>
        <td class="border px-4 py-2">{{ role.users }}</td>
        <td class="border px-4 py-2">{{ role.created }}</td>
        <td class="border px-4 py-2">
          <button class="text-blue-600 hover:underline">Edit</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
