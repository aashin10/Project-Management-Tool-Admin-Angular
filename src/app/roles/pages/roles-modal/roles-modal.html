<!-- Modal Background Overlay -->
<div
  *ngIf="isOpen"
  class="fixed inset-0 bg-black/40 flex items-center justify-center z-50"
>
  <!-- Modal Container -->
  <div class="bg-white rounded-lg shadow-xl w-full max-w-md relative animate-fadeIn">
    
    <!-- Header -->
    <div class="flex justify-between items-center border-b px-4 py-3">
      <h2 class="text-lg font-semibold">Create New Role</h2>
      <button (click)="close.emit()" class="text-gray-500 hover:text-gray-800 text-xl">&times;</button>
    </div>

    <!-- Body -->
    <div class="px-4 py-4 space-y-3">
      
      <!-- Section Title -->
      <h3 class="text-xs font-semibold text-gray-600 uppercase">Role Information</h3>

      <!-- Role Name -->
      <div>
        <label class="block text-xs font-medium text-gray-700">Role Name *</label>
        <input [(ngModel)]="role.name" 
          type="text" 
          placeholder="e.g., Project Manager, Developer"
          class="w-full mt-1 px-2 py-1 border border-gray-300 rounded-md focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm placeholder-gray-400" />
      </div>

      <!-- Description -->
      <div>
        <label class="block text-xs font-medium text-gray-700">Description</label>
        <textarea [(ngModel)]="role.description" 
          placeholder="Describe the role's responsibilities..."
          class="w-full mt-1 px-2 py-1 border border-gray-300 rounded-md focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm placeholder-gray-400"></textarea>
      </div>

      <!-- Clone From -->
      <div>
        <label class="block text-xs font-medium text-gray-700">Clone from Existing Role (Optional)</label>
        <select [(ngModel)]="role.cloneFrom" 
          class="w-full mt-1 px-2 py-1 border border-gray-300 rounded-md focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm">
          <option value="">Select a role to copy permissions from</option>
          <option>Administrator</option>
          <option>Developer</option>
          <option>Viewer</option>
        </select>
      </div>

      <!-- Permissions -->
      <div>
        <label class="block text-xs font-medium text-gray-700">Permissions</label>
        <div class="space-y-1 mt-1 text-sm">
          <div *ngFor="let perm of permissionsList" class="flex items-center space-x-2">
            <input type="checkbox" [checked]="role.permissions.includes(perm)" (change)="togglePermission(perm)" />
            <span class="text-gray-700 text-sm">{{ perm }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-2 border-t px-4 py-3 bg-gray-50">
      <button (click)="close.emit()" class="px-3 py-1.5 bg-gray-200 rounded hover:bg-gray-300 text-sm">Cancel</button>
      <button (click)="submit()" class="px-3 py-1.5 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm">Create Role</button>
    </div>
  </div>
</div>
